name: Create Artifact

on:
  push:
    branches: [release]
    paths-ignore:
      - "**/**.md"

jobs:
  build-project:
    strategy:
      matrix:
        GO_VERSION: [1.22.2]
        OS_WINDOWS: [windows]
        OS_LINUX: [linux]
        Artifact_Name: [SwitchValidationTool]

    # runs-on: ubuntu-latest
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.GO_VERSION }}

      - name: Set up version
        run: |
          YEAR=$(date +'%Y')
          MONTH=$(date +'%m')
          DAY=$(date +'%d')
          VERSION_TAG="${YEAR}.${MONTH}.${DAY}_${{ github.run_number }}"
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

      - name: Install PCAP Compiler
        run: |
          sudo apt update
          sudo apt install libpcap-dev -y

      - name: Unit Test
        run: |
          cd ./src
          ls -R
          go test -v

      - name: Build Windows Artifact
        run: |
          cd ./src
          go mod tidy
          GOOS=${{ matrix.OS_WINDOWS }} GOARCH=amd64 go build -o ./${{ matrix.Artifact_Name }}_${{ env.VERSION_TAG }}/${{ matrix.OS_WINDOWS }}/

      - name: Build Linux Artifact
        run: |
          cd ./src
          go mod tidy
          GOOS=${{ matrix.OS_LINUX }} GOARCH=amd64 go build -o ./${{ matrix.Artifact_Name }}_${{ env.VERSION_TAG }}/${{ matrix.OS_LINUX }}/

      - name: Calculate SHA-256 checksum for Windows Tool
        run: |
          cd ./${{ matrix.Artifact_Name }}_${{ env.VERSION_TAG }}/${{ matrix.OS_WINDOWS }}/
          sha256sum * > checksum_sha256.txt
          cat checksum_sha256.txt

      - name: Calculate SHA-256 checksum for Windows Tool
        run: |
          cd ./${{ matrix.Artifact_Name }}_${{ env.VERSION_TAG }}/${{ matrix.OS_LINUX }}/
          sha256sum * > checksum_sha256.txt
          cat checksum_sha256.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.Artifact_Name }}_${{ env.VERSION_TAG }}
          path: ./src/${{ matrix.Artifact_Name }}_${{ env.VERSION_TAG }}/